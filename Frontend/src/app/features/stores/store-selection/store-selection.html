<div class="min-h-screen bg-[#f8faff]">

  <!-- Header -->
  <header
    class="border-b border-slate-200 bg-white">

    <div
      class="mx-auto flex h-20 max-w-7xl
             items-center justify-between px-5 sm:px-8">

      <div
        class="text-[24px] font-black tracking-[-1.5px]
               text-slate-950">

        SQUAD<span class="text-blue-600">21</span>

      </div>


      <button
        type="button"
        (click)="logout()"
        class="flex items-center gap-2 text-sm
               font-medium text-slate-600
               hover:text-slate-900">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M10 17l5-5-5-5m5 5H3m11-8h5a2
               2 0 012 2v12a2 2 0 01-2 2h-5" />

        </svg>

        Logout

      </button>

    </div>

  </header>


  <main
    class="flex min-h-[calc(100vh-80px)]
           items-center justify-center px-5 py-12">

    <div
      class="w-full max-w-[440px] rounded-2xl
             border border-slate-200 bg-white
             px-6 py-9 shadow-xl shadow-slate-200/50
             sm:px-9">


      <!-- Store Icon -->
      <div
        class="mx-auto mb-5 flex h-16 w-16
               items-center justify-center
               rounded-full bg-blue-50 text-blue-600">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M4 10h16M5 10v9h14v-9M3 10l2-6h14l2
               6M8 14h3v5H8v-5zm7 0h2" />

        </svg>

      </div>


      <div class="text-center">

        <h1
          class="text-xl font-bold text-slate-900">
          Choose Store
        </h1>

        <p
          class="mt-1 text-sm text-slate-500">
          Select a store to continue
        </p>

      </div>


      <div class="mt-8">

        @if (loading()) {

          <div
            class="py-7 text-center text-sm
                   text-slate-500">

            Loading stores...

          </div>

        } @else {

          <select
            [(ngModel)]="selectedStoreId"
            class="h-12 w-full rounded-lg
                   border border-slate-200 bg-white
                   px-4 text-sm text-slate-700
                   outline-none transition
                   focus:border-blue-500
                   focus:ring-2 focus:ring-blue-100">

            <option [ngValue]="null">
              Select Store
            </option>

            @for (store of stores(); track store.id) {

              <option [ngValue]="store.id">
                {{ store.name }}
              </option>

            }

          </select>

        }


        @if (errorMessage()) {

          <p
            class="mt-3 text-sm text-red-600">
            {{ errorMessage() }}
          </p>

        }


        <button
          type="button"
          (click)="continue()"
          [disabled]="selectedStoreId === null"
          class="mt-5 h-12 w-full rounded-lg
                 bg-blue-600 text-sm font-semibold
                 text-white transition
                 hover:bg-blue-700
                 disabled:cursor-not-allowed
                 disabled:bg-blue-100
                 disabled:text-blue-400">

          Continue

        </button>

      </div>

    </div>

  </main>

</div>
